<!DOCTYPE html>
<html lang="da"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>ølrating widget</title>
<style>
html,body{margin:0;background:transparent;font-family:"Segoe UI",Inter,system-ui,sans-serif;user-select:none}
.w{margin:8px;border-radius:22px;padding:16px 18px;color:#EAF1FB;background:linear-gradient(160deg,rgba(26,46,82,.97),rgba(15,29,54,.97) 60%,rgba(60,38,48,.97));box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);-webkit-app-region:drag;height:252px;box-sizing:border-box;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:3px}.t{white-space:nowrap;background:transparent;color:#8FB6E3;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 7px;border-radius:999px;text-transform:uppercase}.t.on{background:rgba(255,122,61,.18);color:#FF7A3D}.t:hover{color:#fff}
.stat{display:flex;gap:20px;margin-top:16px}.stat b{display:block;font-size:34px;color:#fff}.stat b.y{color:#FFC85A}.stat span{font-size:11px;color:#B8C7DE}
button{-webkit-app-region:no-drag;border:0;cursor:pointer;font:inherit}
.ic{background:rgba(255,255,255,.08);color:#B8C7DE;width:26px;height:26px;border-radius:50%;font-size:13px;line-height:26px;padding:0}
.ic:hover{background:rgba(255,255,255,.18);color:#fff}
.ic.on{color:#FFC85A}
.wk{display:flex;align-items:center;gap:10px;margin-top:10px;-webkit-app-region:no-drag;cursor:pointer;border-radius:12px;padding:4px;margin-left:-4px}
.wk:hover{background:rgba(255,255,255,.06)}
.n{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:12px;color:#B8C7DE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:30px;font-weight:800;color:#FFC85A;margin-left:auto}
ol{margin:10px 0 0;padding:0;list-style:none;flex:1}
li{font-size:13px;display:flex;align-items:center;gap:8px;padding:3px 0;border-top:1px solid rgba(255,255,255,.07)}li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li img{width:20px;height:20px;border-radius:5px;object-fit:cover;flex:none}
.wk img{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none}
li b{color:#FFC85A;margin-left:auto}
.f{display:flex;align-items:center;gap:8px}
.f span{font-size:11px;color:#8FB6E3;flex:1}
.add{background:#FF7A3D;color:#0F1D36;font-weight:700;font-size:12px;border-radius:999px;padding:6px 12px}
.add:hover{filter:brightness(1.08)}
</style></head>
<body><div class="w">
  <div class="top"><span class="tabs"><button class="t on" data-v="0">Top</button><button class="t" data-v="1">Nyt</button><button class="t" data-v="2">Mig</button><button class="t" data-v="3">Genst.</button><button class="t" data-v="4">Siden</button></span><span style="flex:1"></span>
    <button class="ic on" id="pin" title="Altid øverst">📌</button>
    <button class="ic" id="x" title="Skjul widget">✕</button></div>
  <div class="wk" id="wk"><img id="wimg" alt="" style="display:none"><div style="min-width:0"><div class="n" id="name">ølrating.dk</div><div class="m" id="meta">Åbn programmet for at hente data</div></div><div class="s" id="score"></div></div>
  <div class="stat" id="stat" style="display:none"><div><b id="sc">–</b><span id="lc">øl smagt</span></div><div><b class="y" id="sa">–</b><span id="la">gns. karakter</span></div></div>
  <ol id="top"></ol>
  <div class="f"><span id="foot"></span><button class="add" id="add">+ Bedøm øl</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
let D=null,V=0,IM={};
const ok=u=>typeof u==='string'&&u.startsWith('data:image/jpeg;base64,');
function li(a,b,id){const l=document.createElement('li'),s=document.createElement('span'),x=document.createElement('b');s.textContent=a;x.textContent=b;l.append(s,x);if(id&&ok(IM[id])){const i=document.createElement('img');i.src=IM[id];i.alt='';l.prepend(i)}return l}
const tal=n=>typeof n==='number'?n.toLocaleString('da-DK'):'–';
function render(d){D=d;
  document.querySelectorAll('.t').forEach(t=>t.classList.toggle('on',+t.dataset.v===V));
  $('wk').style.display=V===0?'':'none';$('stat').style.display=V>=2?'':'none';
  if(V===1){const L=(d&&d.latest)||[];$('top').replaceChildren(...(L.length?L.slice(0,5).map(r=>li(`${r.name} · ${r.who}`,r.score,r.id)):[li('Ingen bedømmelser endnu','')]));$('foot').textContent=d?`${d.reviews} bedømmelser i alt`:'';return}
  if(V===3){const u=(d&&d.units)||{},t=u.todayN||0,w=u.weekN||0,f=x=>String(Math.round(x*10)/10).replace('.',',');$('stat').style.display='';$('sc').textContent=f(t);$('sc').style.color=t>4?'#FF6B8A':'';$('sa').textContent=f(w);$('lc').textContent='genstande i dag';$('la').textContent='på 7 dage (højst 10)';$('top').replaceChildren(li(t>4?'Over 4 i dag – tag en pause':'Tryk +1 når du åbner en øl',''));$('foot').textContent='';$('add').textContent='+1 genstand';return}
  $('sc').style.color='';$('add').textContent='+ Bedøm øl';
  if(V===4){const s=(d&&d.site)||{};$('sc').textContent=tal(s.visits);$('sa').textContent=tal(s.today);$('lc').textContent='besøg i alt';$('la').textContent='besøg i dag';$('top').replaceChildren(li('Øl',tal(d&&d.beers)),li('Bedømmelser',tal(d&&d.reviews)),li('Smagere',tal(s.tasters)));$('foot').textContent=typeof s.visits==='number'?'':'Besøg tælles ikke endnu';return}
  $('lc').textContent='øl smagt';$('la').textContent='gns. karakter';
  if(V===2){const m=d&&d.me;$('top').replaceChildren(li(m&&m.name?(m.style?'Yndlingsstil: '+m.style:'Bedøm din første øl'):'Skriv dit navn på ølrating',''),...(d&&d.rec?[li('Prøv: '+d.rec.name,d.rec.score,d.rec.id)]:[]));$('sc').textContent=m&&m.name?m.beers:'–';$('sa').textContent=m&&m.avg?m.avg:'–';$('foot').textContent=m&&m.name?m.name:'';return}
  const w=d&&d.week;
  $('name').textContent=w?w.name:'Ingen øl endnu';
  $('meta').textContent=w?(w.brewery||''):'Bliv den første til at bedømme en øl';
  $('score').textContent=w?w.score:'';
  {const im=w&&IM[w.id];$('wimg').style.display=ok(im)?'':'none';if(ok(im))$('wimg').src=im}
  $('top').replaceChildren(...((d&&d.top)||[]).slice(0,3).map((t,i)=>li((i+1)+'. '+t.name,t.score,t.id)));
  $('foot').textContent=d?`${d.beers} øl · ${d.reviews} bedømmelser`:'';
}
W.onData(render);W.onImages(o=>{IM=o&&typeof o==='object'?o:{};render(D)});render(null);
$('wk').onclick=()=>W.open('');
document.querySelectorAll('.t').forEach(t=>t.onclick=()=>{V=+t.dataset.v;render(D)});
$('stat').onclick=()=>W.open(V===3?'#genstande':V===4?'#om':'#profil');
$('add').onclick=()=>{if(V===3){W.addUnit();$('add').animate([{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:220})}else W.open('#tilfoej')};
$('x').onclick=()=>W.close();
let pinned=true;$('pin').onclick=()=>{pinned=!pinned;$('pin').classList.toggle('on',pinned);W.pin(pinned)};
</script></body></html>
